name: Auto-merge Dependabot

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge patch/minor updates
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Get Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Auto-merge only patch and minor bumps of GitHub Actions. Everything
      # else waits for a person: a Cargo crate is linked into the app we sign
      # and ship, and a submodule bump moves to a new SHA with arbitrary code.
      # We list what may merge rather than what may not, so an ecosystem
      # added to dependabot.yml later waits for a person too. The metadata
      # names an ecosystem as Dependabot's branch names do (`github_actions`,
      # `cargo`, `submodules`), not as dependabot.yml does. The Action that
      # imports the signing certificate is held back as well, because the
      # release job hands it the certificate and its password.
      - name: Approve and enable auto-merge for patch/minor
        if: |
          (steps.meta.outputs.update-type == 'version-update:semver-patch'
           || steps.meta.outputs.update-type == 'version-update:semver-minor')
          && steps.meta.outputs.package-ecosystem == 'github_actions'
          && !contains(steps.meta.outputs.dependency-names, 'apple-actions/import-codesign-certs')
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
