name: Deploy site

# The site describes the released app, so it goes out with a release and not
# with every merge to `main`. The trigger is the Release workflow finishing:
# a release that workflow publishes with GITHUB_TOKEN starts no `release` event.
# Dispatching this workflow deploys a tag or branch, for a fix that cannot wait.
#
# Required secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   A token that can edit Cloudflare Pages
#   CLOUDFLARE_ACCOUNT_ID  The account that holds the Pages project

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: Tag or branch to deploy
        required: true

permissions:
  contents: read

concurrency:
  group: site-deploy

jobs:
  deploy:
    name: Deploy site
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # A finished Release deploys whatever is Latest, not the tag it ran for. A
      # rerun of an older tag does not make that tag Latest, and a Release
      # dispatched to recover a dropped run has no tag of its own to read.
      - name: Choose what to deploy
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_REF: ${{ inputs.ref }}
        run: |
          if [ -n "${MANUAL_REF}" ]; then
            echo "ref=${MANUAL_REF}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          latest="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
          echo "ref=${latest}" >> "${GITHUB_OUTPUT}"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ steps.target.outputs.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: site/.node-version
      - name: Build
        working-directory: site
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy dist --project-name=weir-site --branch=main
