name: PR Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  validate-title:
    name: Validate PR title (Conventional Commits)
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            test
            build
            ci
            perf
            revert
          scopes: |
            [a-z0-9]+(-[a-z0-9]+)*
          requireScope: false
          subjectPattern: ^[a-z`].+$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter or a backtick, such as "fix(session): preserve saved projects when decoding fails". Start it with a verb in the imperative, or put an identifier that has to come first in backticks. CONTRIBUTING.md ("Commit titles and branches") lists the types, scopes, and subject rules.
